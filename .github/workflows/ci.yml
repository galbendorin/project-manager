name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:ci

      - name: Checklist and recipe React regressions
        run: node --experimental-vm-modules --test scripts/regressions/checklist-recipe.test.mjs scripts/regressions/eisenhower.test.mjs
        env:
          TZ: Europe/London

      - name: Household export and isolated restore checks
        run: |
          npm install --prefix "$RUNNER_TEMP/household-restore" --no-audit --no-fund @electric-sql/pglite@0.5.8
          PGLITE_MODULE="$RUNNER_TEMP/household-restore/node_modules/@electric-sql/pglite/dist/index.js" node --test scripts/household-backup.test.mjs
          PGLITE_MODULE="$RUNNER_TEMP/household-restore/node_modules/@electric-sql/pglite/dist/index.js" node --test scripts/investigations/atomic-recipe-update.test.mjs
          PGLITE_MODULE="$RUNNER_TEMP/household-restore/node_modules/@electric-sql/pglite/dist/index.js" node --test scripts/investigations/eisenhower-sql.test.mjs

      - name: Build app
        run: npm run build

      - name: Install smoke browser
        run: npx playwright-core install --with-deps chromium

      - name: Core Shopping release smoke
        run: |
          node --test scripts/shopping-smoke/service.test.mjs
          npm run smoke:shopping

      - name: Verify smoke detects a failed retry
        run: npm run smoke:shopping -- --prove-failure
        env:
          SHOPPING_SMOKE_OUTPUT: tmp/shopping-smoke-negative

      - name: Upload Shopping smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopping-smoke-evidence
          path: |
            tmp/shopping-smoke/
            tmp/shopping-smoke-negative/
          if-no-files-found: ignore
